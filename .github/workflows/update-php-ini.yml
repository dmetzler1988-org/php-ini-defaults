name: Update PHP ini defaults

on:
  # Run manually from the Actions tab
  workflow_dispatch:
  # Run automatically when the PHP_VERSIONS list is changed
  push:
    branches: [main]
    paths:
      - 'start.sh'

permissions:
  contents: write

concurrency:
  group: update-php-ini
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Collect php.ini files from Docker images
        run: bash start.sh

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes - nothing to commit."
            exit 0
          fi
          git commit -m "Update PHP ini defaults [skip ci]"
          git push
